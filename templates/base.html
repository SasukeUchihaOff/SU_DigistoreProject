{% load static %}
{% load catalog_extras %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}DigiStore{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="header">
    <a class="logo" href="{% url 'home' %}">DigiStore</a>
    <nav>
      <a href="{% url 'catalog:service_list' %}">Услуги</a>
      <a href="{% url 'cart:detail' %}">Корзина</a>
      <a href="{% url 'orders:list' %}">Заказы</a>
    </nav>
  </header>

  <div class="layout">
    <main>
      {% block content %}{% endblock %}
    </main>
    <aside>
      {% popular_services 3  %}
    </aside>
  </div>

  <footer class="footer">© 2026 DigiStore</footer>
</body>
</html>
